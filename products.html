<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMP | Product Catalog</title>
    <style>
        :root {
            --bg: #0f172a;
            --bg-soft: #1f2937;
            --panel: rgba(15, 23, 42, 0.9);
            --white: #f8fafc;
            --muted: #dbe3f5;
            --pink: #ec4899;
            --purple: #8b5cf6;
            --blue: #3b82f6;
            --teal: #14b8a6;
            --gold: #f59e0b;
            --orange: #f97316;
            --border: rgba(255, 255, 255, 0.14);
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: var(--white);
            background:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.45), transparent 28%),
                radial-gradient(circle at bottom right, rgba(45, 212, 191, 0.35), transparent 25%),
                linear-gradient(135deg, var(--bg) 0%, #111827 40%, var(--bg-soft) 100%);
        }

        a { text-decoration: none; color: inherit; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 0 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.22rem;
            text-transform: uppercase;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
            display: grid;
            place-items: center;
            box-shadow: 0 0 18px rgba(255, 79, 216, 0.55);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-link,
        .primary-btn,
        .ghost-btn,
        .nav-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 0.8rem 1.2rem;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .nav-link {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--white);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: var(--white);
            box-shadow: 0 12px 26px rgba(167, 139, 250, 0.35);
        }

        .floating-seller {
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
            color: var(--white);
            font-size: 1.35rem;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 16px 32px rgba(168, 85, 247, 0.45);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: var(--white);
            box-shadow: 0 16px 30px rgba(139, 92, 246, 0.35);
        }

        .ghost-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: var(--white);
        }

        .nav-link:hover,
        .primary-btn:hover,
        .ghost-btn:hover {
            transform: translateY(-2px);
        }

        .hero {
            text-align: center;
            padding: 1rem 0 2rem;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 1rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--muted);
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            font-size: 0.76rem;
            margin-bottom: 1rem;
        }

        .eyebrow .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--teal), var(--gold));
            box-shadow: 0 0 12px rgba(45, 212, 191, 0.8);
        }

        h1 {
            font-size: clamp(2.4rem, 5vw, 4rem);
            letter-spacing: -0.06em;
            margin-bottom: 0.8rem;
        }

        .gradient-text {
            background: linear-gradient(90deg, #fef3c7 0%, #f9a8d4 25%, #c4b5fd 60%, #7dd3fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            max-width: 700px;
            margin: 0 auto 2rem;
            color: var(--muted);
            font-size: 1.06rem;
        }

        .catalog-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.22);
        }

        .image-wrap {
            position: relative;
            margin-bottom: 1rem;
        }

        .tag {
            position: absolute;
            top: 0.7rem;
            left: 0.7rem;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            color: #1f2937;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            padding: 0.45rem 0.7rem;
            text-transform: uppercase;
        }

        .product-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .product-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .product-header h3 {
            font-size: 1.2rem;
        }

        .price {
            font-weight: 700;
            color: #fef3c7;
        }

        .rating {
            color: #fbbf24;
            letter-spacing: 0.08rem;
            font-size: 0.82rem;
            margin-bottom: 0.8rem;
        }

        .attributes {
            display: grid;
            gap: 0.55rem;
            margin-bottom: 1rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .attributes span {
            display: block;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.42rem 0.6rem;
        }

        .variant-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.6rem;
            margin: 0.9rem 0 1rem;
        }

        .variant-field {
            display: grid;
            gap: 0.35rem;
        }

        .variant-field label {
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.06rem;
            text-transform: uppercase;
        }

        .variant-field select {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            padding: 0.65rem 0.7rem;
            font: inherit;
        }

        .product-card button {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255, 79, 216, 0.2), rgba(56, 189, 248, 0.18));
            color: var(--white);
            padding: 0.8rem 1rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.15);
        }

        @media (max-width: 640px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .catalog-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .primary-btn,
            .ghost-btn,
            .nav-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">C</span>
                <span>CAMP</span>
            </div>
            <nav class="nav-links" aria-label="Main navigation">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="payment.html">Payment</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <div class="eyebrow"><span class="dot"></span> Product catalog</div>
                <h1>Shop the <span class="gradient-text">CAMP collection</span></h1>
                <p class="subtitle">A curated selection of everyday essentials, all sorted from the lowest price to the highest so you can shop quickly and confidently.</p>
            </section>

            <div class="catalog-actions">
                <a class="primary-btn" href="payment.html">Proceed to payment</a>
                <a class="ghost-btn" href="index.html">Back to home</a>
            </div>

            <section class="product-grid" id="product-grid" aria-live="polite"></section>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        const CART_STORAGE_KEY = 'camp-cart';
        const SELLER_INVENTORY_KEY = 'camp-seller-inventory';
        const sizeOptions = ['S', 'M', 'L', 'XL'];
        const colorOptions = ['Black', 'White', 'Red', 'Blue', 'Green', 'Beige'];

        function readSellerInventory() {
            try {
                const saved = JSON.parse(localStorage.getItem(SELLER_INVENTORY_KEY) || '[]');
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                return [];
            }
        }

        const defaultProducts = [
            {
                id: 'camp-bandana',
                name: 'Camp Bandana',
                price: 18.5,
                image: 'gocrazy1.PNG',
                tag: 'value pick',
                rating: '★★★★★',
                attributes: ['Material: Cotton', 'Fit: Relaxed', 'Size: One size', 'Color: Sunset red']
            },
            {
                id: 'everyday-tee',
                name: 'Everyday Tee',
                price: 24.99,
                image: 'gocrazy2.PNG',
                tag: 'best seller',
                rating: '★★★★☆',
                attributes: ['Material: Premium jersey', 'Fit: Regular', 'Size: S-XL', 'Color: Slate blue']
            },
            {
                id: 'utility-shirt',
                name: 'Utility Shirt',
                price: 42.0,
                image: 'gocrazy3.PNG',
                tag: 'new',
                rating: '★★★★★',
                attributes: ['Material: Twill cotton', 'Fit: Structured', 'Size: M-XXL', 'Color: Olive green']
            },
            {
                id: 'street-jacket',
                name: 'Street Jacket',
                price: 68.75,
                image: 'gocrazy4.PNG',
                tag: 'trending',
                rating: '★★★★★',
                attributes: ['Material: Lightweight shell', 'Fit: Oversized', 'Size: L-XXL', 'Color: Black mist']
            },
            {
                id: 'casual-pants',
                name: 'Casual Pants',
                price: 79.99,
                image: 'gocrazy3.PNG',
                tag: 'featured',
                rating: '★★★★☆',
                attributes: ['Material: Stretch twill', 'Fit: Straight', 'Size: S-XL', 'Color: Stone beige']
            },
            {
                id: 'denim-jacket',
                name: 'Denim Jacket',
                price: 89.99,
                image: 'gocrazy2.PNG',
                tag: 'signature',
                rating: '★★★★★',
                attributes: ['Material: Raw denim', 'Fit: Classic', 'Size: M-XXL', 'Color: Indigo wash']
            }
        ];

        async function apiRequest(path, options = {}) {
            const response = await fetch(`${API_BASE_URL}${path}`, {
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                ...options,
            });

            const contentType = response.headers.get('content-type') || '';
            const payload = contentType.includes('application/json') ? await response.json() : await response.text();

            if (!response.ok) {
                throw new Error(payload.message || 'Request failed');
            }

            return payload;
        }

        function readCartFromStorage() {
            try {
                const savedCart = localStorage.getItem(CART_STORAGE_KEY);
                return savedCart ? JSON.parse(savedCart) : [];
            } catch (error) {
                return [];
            }
        }

        function saveCartToStorage(cart) {
            try {
                localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            } catch (error) {
                // Ignore storage errors in restricted browser contexts.
            }
        }

        function addToCart(productId) {
            const product = products.find((item) => item.id === productId);
            if (!product) return;

            const card = document.querySelector(`article[data-product-id="${productId}"]`);
            const selectedSize = card?.querySelector('select[data-size-select]')?.value || sizeOptions[0];
            const selectedColor = card?.querySelector('select[data-color-select]')?.value || colorOptions[0];

            const cart = readCartFromStorage();
            const existing = cart.find((item) => item.id === productId && item.size === selectedSize && item.color === selectedColor);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, size: selectedSize, color: selectedColor, qty: 1 });
            }

            saveCartToStorage(cart);

            const button = document.querySelector(`button[data-product-id="${productId}"]`);
            if (button) {
                const original = button.textContent;
                button.textContent = 'Added';
                window.setTimeout(() => {
                    button.textContent = original;
                }, 900);
            }
        }

        const productGrid = document.getElementById('product-grid');

        function money(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(value);
        }

        function buildProductCard(product) {
            const card = document.createElement('article');
            card.className = 'product-card';
            card.dataset.productId = product.id;
            card.innerHTML = `
                <div class="image-wrap">
                    <span class="tag">${product.tag || 'featured'}</span>
                    <img src="${product.image || product.image_url || 'gocrazy1.PNG'}" alt="${product.name}">
                </div>
                <div class="product-header">
                    <h3>${product.name}</h3>
                    <span class="price">${money(Number(product.price || 0))}</span>
                </div>
                <div class="rating">${product.rating || '★★★★★'}</div>
                <div class="attributes">
                    ${(product.attributes || [
                        `Material: ${product.material || 'Premium cotton'}`,
                        `Fit: ${product.fit || 'Relaxed'}`,
                        'Size: S-XL',
                        `Color: ${product.color || 'Classic'}`
                    ]).map((attribute) => `<span>${attribute}</span>`).join('')}
                </div>
                <div class="variant-row">
                    <div class="variant-field">
                        <label for="size-${product.id}">Size</label>
                        <select id="size-${product.id}" data-size-select>
                            ${sizeOptions.map((size) => `<option value="${size}">${size}</option>`).join('')}
                        </select>
                    </div>
                    <div class="variant-field">
                        <label for="color-${product.id}">Color</label>
                        <select id="color-${product.id}" data-color-select>
                            ${colorOptions.map((color) => `<option value="${color}">${color}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <button type="button" data-product-id="${product.id}">Add to cart</button>
            `;
            return card;
        }

        function renderCatalog(items) {
            productGrid.innerHTML = '';
            items.forEach((product) => {
                const card = buildProductCard(product);
                productGrid.appendChild(card);
            });

            productGrid.querySelectorAll('button[data-product-id]').forEach((button) => {
                button.addEventListener('click', () => addToCart(button.dataset.productId));
            });
        }

        async function loadCatalog() {
            let backendProducts = [];
            try {
                const result = await apiRequest('/products');
                backendProducts = Array.isArray(result.products) ? result.products : [];
            } catch (error) {
                console.warn('Backend catalog unavailable; falling back to static products.', error.message);
            }

            const sourceProducts = backendProducts.length ? backendProducts : defaultProducts;
            const mergedProducts = [...sourceProducts, ...readSellerInventory()].filter(Boolean).sort((a, b) => Number(a.price) - Number(b.price));
            renderCatalog(mergedProducts);
        }

        loadCatalog();
    </script>
</body>
</html>
